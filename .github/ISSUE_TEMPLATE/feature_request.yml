name: Feature request
description: Suggest an improvement or a new source
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: This project stays honest and local by design.
      options:
        - label: This does not fabricate candidate facts or claim work that is not done.
          required: true
        - label: If this adds a job source, it uses a public documented API (not LinkedIn/Wellfound sessions).
          required: true